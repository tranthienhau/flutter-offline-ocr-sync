name: flutter_offline_ocr_sync
description: Offline-first vendor inventory POC with SQLite, on-device ML Kit OCR, and background Firebase sync.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  google_mlkit_text_recognition: ^0.14.0
  camera: ^0.11.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
